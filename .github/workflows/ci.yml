name: CI

# One job. The whole suite takes about a minute, so a second job would spend
# more time on Flutter setup than it saves. A newer push to a pull request
# cancels the older run. A change that touches only docs does not start a run.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_SDK_REMOTE_REFERENCE_URL: http://127.0.0.1:8081/chat
      AI_SDK_MCP_REFERENCE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .fvmrc is the only place the Flutter version is pinned.
      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: make format-check DART=dart

      - name: Analyze
        run: make analyze DART=dart

      - name: Set up Node for pinned protocol fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned protocol fixtures
        run: |
          npm ci --ignore-scripts --prefix examples/remote_backend/js
          npm ci --ignore-scripts --prefix examples/mcp_reference/js

      - name: Start remote protocol fixture
        run: |
          node examples/remote_backend/js/server.mjs > "$RUNNER_TEMP/remote-reference.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/remote-reference.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8081/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/remote-reference.log"
          exit 1

      # Runs every package test once. The same run feeds the ratchet gate that
      # prevents coverage regressions across the published packages.
      - name: Test packages with coverage (gate)
        run: make coverage-check DART=dart FLUTTER=flutter

      - name: Test tooling
        run: dart test tool/

      - name: Check provider catalog
        run: make catalog-check DART=dart

      - name: Test examples
        run: make test-examples DART=dart FLUTTER=flutter

      - name: Stop remote protocol fixture
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/remote-reference.pid"; then
            kill "$(cat "$RUNNER_TEMP/remote-reference.pid")" 2>/dev/null || true
          fi
