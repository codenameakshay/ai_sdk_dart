name: CI

# One job runs the whole suite, which takes about a minute. Two small jobs
# check that a host can depend on the packages from git and that the engine
# tests pass outside UTC. A newer push to a pull request cancels the older run.
# A change that touches only docs does not start a run.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_SDK_REMOTE_REFERENCE_URL: http://127.0.0.1:8081/chat
      AI_SDK_MCP_REFERENCE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .fvmrc is the only place the Flutter version is pinned.
      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: make format-check DART=dart

      - name: Analyze
        run: make analyze DART=dart

      - name: Set up Node for pinned protocol fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned protocol fixtures
        run: |
          npm ci --ignore-scripts --prefix examples/remote_backend/js
          npm ci --ignore-scripts --prefix examples/mcp_reference/js

      - name: Check OpenUI conformance vectors against lang-core
        run: make test-openui-conformance

      - name: Test remote backend fixture
        run: npm test --prefix examples/remote_backend/js

      - name: Start remote protocol fixture
        run: |
          node examples/remote_backend/js/server.mjs > "$RUNNER_TEMP/remote-reference.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/remote-reference.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8081/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/remote-reference.log"
          exit 1

      # Runs every package test once. The same run feeds the ratchet gate that
      # prevents coverage regressions across the published packages.
      - name: Test packages with coverage (gate)
        run: make coverage-check DART=dart FLUTTER=flutter

      - name: Test the OpenUI engine on dart2js
        run: make test-web DART=dart

      - name: Test tooling
        run: dart test tool/

      - name: Check provider catalog
        run: make catalog-check DART=dart

      - name: Test examples
        run: make test-examples DART=dart FLUTTER=flutter

      - name: Stop remote protocol fixture
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/remote-reference.pid"; then
            kill "$(cat "$RUNNER_TEMP/remote-reference.pid")" 2>/dev/null || true
          fi

  # A host app pins the renderer by commit as a git dependency. This resolves
  # ai_sdk_openui and open_intelligent_ui_core from this commit on GitHub, with
  # no dependency_overrides, and analyzes an app that uses both.
  git-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve and analyze a scratch app that uses the packages from git
        run: >-
          tool/git_consumer_check.sh
          "https://github.com/${{ github.repository }}.git"
          "${{ github.event.pull_request.head.sha || github.sha }}"

  # The engine reads dates in the device zone by default; this catches tests
  # that only pass in UTC.
  openui-non-utc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test the OpenUI engine in UTC+05:30
        run: cd packages/ai_sdk_openui && TZ=Asia/Kolkata dart test
