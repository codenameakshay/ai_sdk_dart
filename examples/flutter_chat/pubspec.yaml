name: flutter_chat
description: Flutter example app for AI SDK Dart — demonstrates ChatController, CompletionController, and ObjectStreamController.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.3"

dependencies:
  flutter:
    sdk: flutter
  ai_sdk_dart: ^2.0.0
  ai_sdk_openai: ^2.0.0
  ai_sdk_flutter_ui: ^2.0.0
  ai_sdk_conversation: ^3.0.0
  ai_sdk_remote: ^3.0.0
  ai_sdk_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
