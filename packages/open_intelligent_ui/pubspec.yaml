name: open_intelligent_ui
description: Flutter renderer for Open Intelligent UI answers written in OpenUI Lang 1.0, a port of thesysdev/open-intelligent-ui.
version: 3.1.0
homepage: https://github.com/codenameakshay/ai_sdk_dart
repository: https://github.com/codenameakshay/ai_sdk_dart
resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.3"

dependencies:
  flutter:
    sdk: flutter
  ai_sdk_openui:
    # ignore: invalid_dependency
    path: ../ai_sdk_openui
  http: ^1.6.0
  open_intelligent_ui_chat:
    # ignore: invalid_dependency
    path: ../open_intelligent_ui_chat
  open_intelligent_ui_core:
    # ignore: invalid_dependency
    path: ../open_intelligent_ui_core
  open_intelligent_ui_maps:
    # ignore: invalid_dependency
    path: ../open_intelligent_ui_maps
  open_intelligent_ui_math:
    # ignore: invalid_dependency
    path: ../open_intelligent_ui_math
  open_intelligent_ui_web:
    # ignore: invalid_dependency
    path: ../open_intelligent_ui_web
  url_launcher: ^6.3.1

dev_dependencies:
  ai_sdk_dart: ^3.1.0
  ai_sdk_flutter_ui: ^3.1.0
  ai_sdk_provider: ^3.1.0
  flutter_map: ^8.2.1
  flutter_math_fork: ^0.7.4
  flutter_test:
    sdk: flutter
  latlong2: ^0.9.1
  webview_flutter_platform_interface: ^2.15.1

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
